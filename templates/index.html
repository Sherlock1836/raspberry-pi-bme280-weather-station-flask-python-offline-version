<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Raspberry Pi BME280 Weather Station Using Flask and Python</title>
    <link
      href="static/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/css/style.css" />
    <script src="static/plotly-2.16.1.min.js"></script>
    <style>
      @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0; }
        100% { opacity: 1; }
      }
      .gallery-scrollbar::-webkit-scrollbar { height: 8px; }
      .gallery-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo-details">
        <i class='bx bx-microchip'></i>
        <span class="logo_name">donskytech</span>
      </div>
      <ul class="nav-links">
        <li>
          <a href="#" class="active">
            <i class="bx bx-grid-alt"></i>
            <span class="links_name">Dashboard</span>
          </a>
        </li>
      </ul>
    </div>
    <section class="home-section">
      <nav>
        <div class="sidebar-button">
          <i class="bx bx-menu sidebarBtn"></i>
          <span class="dashboard">Raspberry Pi BME280 Weather Station Using Flask and Python</span>
        </div>
      </nav>
      <div class="home-content">
        <div class="overview-boxes">
          <div class="box">
            <div class="right-side">
              <div class="box-topic">Temperature</div>
              <div class="number" id="temperature"></div>
            </div>
            <i class="bx bxs-thermometer readings"></i>
          </div>
          <div class="box">
            <div class="right-side">
              <div class="box-topic">Humidity</div>
              <div class="number" id="humidity"></div>
            </div>
            <i class="bx bxs-droplet-half readings two"></i>
          </div>
          <div class="box">
            <div class="right-side">
              <div class="box-topic">Pressure</div>
              <div class="number" id="pressure"></div>
            </div>
            <i class="bx bxs-tachometer readings three"></i>
          </div>
          <div class="box">
            <div class="right-side">
              <div class="box-topic">Approx Altitude</div>
              <div class="number" id="altitude"></div>
            </div>
            <i class="bx bxs-building readings four"></i>
          </div>
        </div>
        <div class="graph-box">
          <div class="history-charts">
            <div class="title">History Charts</div>
            <div class="history-details">
              <div class="history-col-item">
                <div id="temperature-history" class="history-divs"></div>
                <div id="humidity-history" class="history-divs"></div>
              </div>
              <div class="history-col-item">
                <div id="pressure-history" class="history-divs"></div>
                <div id="altitude-history" class="history-divs"></div>
              </div>
            </div>
          </div>
          <div class="gaugeCharts">
            <div class="title">Gauge Charts</div>
            <div class="gauge-list">
              <div class="gauge-box"><div id="temperature-gauge"></div></div>
              <div class="gauge-box"><div id="humidity-gauge"></div></div>
              <div class="gauge-box"><div id="pressure-gauge"></div></div>
              <div class="gauge-box"><div id="altitude-gauge"></div></div>
            </div>
          </div>
        </div>
        
        <div class="graph-box" style="margin-top: 20px;">
          <div style="flex: 1; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 5px 10px rgba(0,0,0,0.1);">
            <div class="title" style="font-size: 24px; font-weight: 500; margin-bottom: 15px;">Camera Viewfinder</div>
            
            <!-- Unified Viewfinder -->
            <div style="text-align: center; background: #000; border-radius: 8px; overflow: hidden; position: relative; min-height: 480px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 10px rgba(0,0,0,0.5);">
              <span id="camera-off-text" style="color: #fff; font-size: 18px;"><i class='bx bx-power-off'></i> Camera is Off</span>
              <img id="img-live-stream" alt="Live Camera Feed" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;" />
              <div id="recording-indicator" style="display: none; position: absolute; top: 20px; right: 20px; color: red; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; animation: blink 1s infinite;">
                ⏺ RECORDING
              </div>
            </div>

            <!-- Controls -->
            <div style="margin-top: 20px; display: flex; justify-content: center; gap: 15px;">
              <button id="btn-toggle-stream" style="padding: 10px 20px; cursor: pointer; background: #0A2558; color: #fff; border: none; border-radius: 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; transition: 0.3s;"><i class='bx bx-power-off'></i> Turn On</button>
              <button id="btn-capture-photo" disabled style="padding: 10px 20px; cursor: pointer; background: #28a745; color: #fff; border: none; border-radius: 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; opacity: 0.5; transition: 0.3s;"><i class='bx bx-camera'></i> Take Photo</button>
              <button id="btn-toggle-record" disabled style="padding: 10px 20px; cursor: pointer; background: #dc3545; color: #fff; border: none; border-radius: 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; opacity: 0.5; transition: 0.3s;"><i class='bx bx-video'></i> Start Record</button>
            </div>

            <!-- Gallery Section -->
            <div class="title" style="font-size: 20px; font-weight: 500; margin-top: 30px; margin-bottom: 10px;">Gallery</div>
            <div id="gallery-container" class="gallery-scrollbar" style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; min-height: 120px; background: #f5f5f5; padding: 15px; border-radius: 8px; border: 1px solid #ddd;">
              <!-- Thumbnails will be injected here via JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="static/main.js"></script>
  </body>
</html>
